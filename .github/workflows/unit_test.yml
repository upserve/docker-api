name: Unit Tests
on:
  push:
    branches:
      # A test branch for seeing if your tests will pass in your personal fork
      - test_me_github
  pull_request:
    branches:
      - main
      - master
jobs:
  docker-rspec:
    runs-on:
      - ubuntu-latest
    strategy:
      matrix:
        ruby:
          - '4.0'
          - 3.4
          - 3.3
          - 3.2
          - 3.1
          - '3.0'
          - 2.7
          - 2.6
          - 2.5
          - 2.4
        docker_version:
          - ':26.'
          - ':27.'
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Update gems
        run: bundle update
      - name: install docker
        env:
          DOCKER_VERSION: ${{ matrix.docker_version }}
        run: |
          set -x
          sudo apt-get remove -y docker docker-engine docker.io containerd runc ||:
          sudo apt-get update -y
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          # apt-key is deprecated and slated for removal; use a keyring instead.
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/keyrings/docker.asc > /dev/null
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update -y
          sudo apt-cache gencaches
          version=$( apt-cache madison docker-ce | grep -e "$DOCKER_VERSION" | cut -f 2 -d '|' | head -1 | sed 's/\s//g' )
          if [ -z "$version" ]; then
            echo "Error: Could not find a docker-ce package matching ${DOCKER_VERSION}"
            echo "Available docker versions:"
            apt-cache madison docker-ce
            exit 1
          fi
          # The runner image preinstalls a newer docker-ce than the versions
          # pinned in the matrix, so installing the pin is a downgrade.
          sudo apt-get install -y --allow-downgrades docker-ce="$version"
          sudo systemctl start docker
          docker version
      - name: spec tests
        run: bundle exec rake

  podman-rspec:
    runs-on:
      - ubuntu-latest
    strategy:
      matrix:
        ruby:
          - '4.0'
          - 3.4
          - 3.3
          - 3.2
          - 3.1
          - '3.0'
          - 2.7
          - 2.6
          - 2.5
          - 2.4
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Update gems
        run: bundle update
      - name: Start rootless Podman API service
        run: |
          mkdir -p "${HOME}/var/run"
          podman system service unix://${HOME}/var/run/podman.sock --time=0 &
          echo $! > $HOME/podman_service.pid
          # Wait until the socket is ready
          for i in $(seq 1 20); do
            if podman --url unix://${HOME}/var/run/podman.sock info >/dev/null 2>&1 ; then
              echo "Podman socket ready"; break
            fi
            echo "Waiting for podman socket…"
            sleep 1
          done
      - name: Point Docker-API at Podman
        run: |
          echo "DOCKER_HOST=unix://${HOME}/var/run/podman.sock" >> $GITHUB_ENV
          echo "EXPECT_PODMAN=true" >> $GITHUB_ENV
      - name: spec tests
        run: bundle exec rake
