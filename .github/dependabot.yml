version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a newly published action version, so a
    # compromised release has time to be caught and pulled.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
